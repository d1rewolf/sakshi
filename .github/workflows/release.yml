name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The LGPL ffmpeg each installer ships next to sakshi (packaging/build-ffmpeg.sh). Cached, so it is only rebuilt when
  # the script changes. Windows cross-compiles on Linux.
  ffmpeg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: ubuntu-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - id: cache
        uses: actions/cache@v6
        with:
          path: ffmpeg-out
          key: ffmpeg-${{ matrix.rid }}-${{ hashFiles('packaging/build-ffmpeg.sh') }}
      - name: Install build tools
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm ${{ matrix.rid == 'win-x64' && 'mingw-w64' || '' }}
      - name: Build ffmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: packaging/build-ffmpeg.sh ${{ matrix.rid }} ffmpeg-out
      - uses: actions/upload-artifact@v6
        with:
          name: ffmpeg-${{ matrix.rid }}
          path: ffmpeg-out/

  pack:
    needs: ffmpeg
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161
      - name: Work out the version
        # A tag v1.2.3 releases 1.2.3. Anything else is a dry run and never gets uploaded. (vpk rejects versions below 0.0.1.)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.1-dryrun.${{ github.run_number }}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Publish
        run: dotnet publish src/Sakshi.App -c Release -r ${{ matrix.rid }} --self-contained -p:PublishReadyToRun=true -p:Version=$VERSION -o publish
      - name: Publish the tray executable (Windows)
        if: runner.os == 'Windows'
        run: dotnet publish src/Sakshi.Tray -c Release -r win-x64 --self-contained -p:PublishReadyToRun=true -p:Version=$VERSION -o publish
      - uses: actions/download-artifact@v7
        with:
          name: ffmpeg-${{ matrix.rid }}
          path: publish
      - name: Make the shipped ffmpeg executable
        # Artifacts do not keep file modes.
        run: chmod +x publish/ffmpeg* && ls -l publish/ffmpeg*
      - name: Build the macOS icon
        if: runner.os == 'macOS'
        run: |
          mkdir sakshi.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s packaging/sakshi.png --out sakshi.iconset/icon_${s}x${s}.png
            sips -z $((s*2)) $((s*2)) packaging/sakshi.png --out sakshi.iconset/icon_${s}x${s}@2x.png
          done
          iconutil -c icns sakshi.iconset -o packaging/sakshi.icns
      - name: Pack (Linux)
        if: runner.os == 'Linux'
        run: vpk pack -u sakshi -v $VERSION -p publish --packTitle Sakshi --packAuthors "Sakshi contributors" -e sakshi -i packaging/sakshi.png
      - name: Pack (macOS)
        if: runner.os == 'macOS'
        run: vpk pack -u sakshi -v $VERSION -p publish --packTitle Sakshi --packAuthors "Sakshi contributors" -e sakshi -i packaging/sakshi.icns --bundleId io.github.d1rewolf.sakshi
      - name: Pack (Windows)
        # vpk statically scans the main exe's own assembly (sakshiw.dll) for a call to VelopackApp.Run. The call
        # is in Sakshi.App.dll, reached first via Program.RunTray -> StartVelopack, so the scan cannot see it.
        # --packTitle also names the root stub (Sakshi.exe); keep it equal to TrayExecutable.WindowsRootStub.
        if: runner.os == 'Windows'
        run: vpk pack -u sakshi -v $VERSION -p publish --packTitle Sakshi --packAuthors "Sakshi contributors" -e sakshiw.exe -i packaging/sakshi.ico --framework vcredist143-x64 --shortcuts StartMenuRoot --skipVeloAppCheck
      - uses: actions/upload-artifact@v6
        with:
          name: releases-${{ matrix.rid }}
          path: Releases/

  # One job, run once, so the three OS uploads cannot race on one Release. All are drafts except the
  # last, which publishes. Only a pushed v* tag gets here.
  upload:
    needs: pack
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161
      - name: Upload each OS to one Release
        # Passed through env, not spliced into the script: a tag name is user-controlled text.
        env:
          TAG: ${{ github.ref_name }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pair in linux:linux-x64 osx:osx-arm64 win:win-x64; do
            channel="${pair%%:*}"
            publish=""
            [[ "$channel" == win ]] && publish="--publish"
            vpk upload github -o artifacts/releases-${pair##*:} --channel "$channel" \
              --repoUrl https://github.com/d1rewolf/sakshi --token "$TOKEN" \
              --merge $publish --tag "$TAG" --releaseName "Sakshi $TAG"
          done
      - name: Attach the source of the shipped ffmpeg
        # The LGPL asks that whoever gets the binary can get its source; this is the exact tarball it was built from.
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/^VERSION=//p' packaging/build-ffmpeg.sh)
          sha=$(sed -n 's/^SHA256=//p' packaging/build-ffmpeg.sh)
          curl -fsSL -o "ffmpeg-$version.tar.xz" "https://ffmpeg.org/releases/ffmpeg-$version.tar.xz"
          echo "$sha  ffmpeg-$version.tar.xz" | sha256sum -c -
          gh release upload "$TAG" "ffmpeg-$version.tar.xz" --repo "$GITHUB_REPOSITORY"
